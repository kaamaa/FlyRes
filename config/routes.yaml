# Klassisches Frontend entfernt. Hier bleiben nur die von Web + Mobile geteilten
# Login/Logout-Routen. Web-Routen: config/routes/modern.yaml · Mobile-API: config/routes/api.yaml
# (Sonnenzeiten-Werkzeug ist jetzt im Web-Frontend: modern_sunrise, nur Global-Admin.)

# Startseite -> modernes Dashboard
_default:
    path: /
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: modern_dashboard
        permanent: false

app_login:
    path:   /login
    controller: App\Controller\LoginController::login
api_login_v2:
    path:   /api/login
    controller: App\Controller\LoginController::apiLogin
    methods: POST
api_logout_v2:
    path:   /api/logout
    controller: App\Controller\LoginController::apiLogout
    methods: POST
api_verify_v2:
    path:   /api/verify
    controller: App\Controller\LoginController::apiVerify
    methods: POST

app_logout:
    path:   /logout
    methods: GET
