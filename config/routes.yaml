# Klassisches Frontend entfernt. Hier bleiben nur die von Web + Mobile geteilten
# Login/Logout-Routen und das eigenstaendige Sonnenauf-/untergang-Tool.
# Web-Routen: config/routes/modern.yaml · Mobile-API: config/routes/api.yaml

# Startseite -> modernes Dashboard
_default:
    path: /
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: modern_dashboard
        permanent: false

_Sunrise_Sunset:
    path:  /sunrise_sunset
    controller: App\Controller\Sunrise_SunsetController::ViewAction

app_login:
    path:   /login
    controller: App\Controller\LoginController::login
api_login:
    path:   /loginwithcredentials
    controller: App\Controller\LoginController::loginwithcredentials
api_login_v2:
    path:   /api/login
    controller: App\Controller\LoginController::apiLogin
    methods: POST
api_logout_v2:
    path:   /api/logout
    controller: App\Controller\LoginController::apiLogout
    methods: POST
api_verify_v2:
    path:   /api/verify
    controller: App\Controller\LoginController::apiVerify
    methods: POST

app_logout:
    path:   /logout
    methods: GET
