# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration

# Die Reihenfolge der Parameter ist relvant, eine falsche Reihenfolge führt zu Fehlermedungen
# Nach jeder Änderung sicherheitshalber:
# php bin/console cache:clear
   

parameters:
    locale: de_DE
    app_version: '7.0'
    program_version: 'FlyRes %app_version%'
    mail_from: '%env(MAIL_FROM)%'
    # Vertrauenswuerdige Fremd-Origins fuer CORS (Joomla-Einbettung der FlyRes-Subdomain).
    # Kommagetrennt erweiterbar. Genutzt vom CorsSubscriber + ApiController::denyCrossOrigin.
    app.cors_allowed_origins: 'https://www.flugschule-worms.de'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        public: true    

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Entities/'
            - '../src/Kernel.php'
            - '../src/Logging.php'
            - '../src/LogonType.php'
            - '../src/SessionData.php'
            - '../src/TimeFunctions.php'
            - '../src/ViewHelper.php'

    # CORS fuer die vertrauenswuerdigen Fremd-Origins (Cross-Site-iframe/Joomla)
    App\EventSubscriber\CorsSubscriber:
        arguments:
            $allowedOrigins: '%app.cors_allowed_origins%'

    # CSRF-Origin-Schutz fuer die /modern-POST-Formulare (server-gerendert, ohne Token)
    App\EventSubscriber\CsrfOriginSubscriber:
        arguments:
            $allowedOrigins: '%app.cors_allowed_origins%'