# ---------------------------------------------------------------------------
# Vorschau "modernes Web-Design" (Variante A). Eigene Datei, damit
# config/routes.yaml unangetastet bleibt. Zugriff: eingeloggt (ROLE_PILOT),
# Pruefung im Controller. Filter laufen ueber Query-Parameter
# (?zeitraum=&umfang=&zweck=&gruppieren=&q=).
# ---------------------------------------------------------------------------

modern_dashboard:
    path: /web
    controller: App\Controller\ModernPreviewController::dashboard
    methods: GET

modern_help:
    path: /web/anleitung
    controller: App\Controller\ModernPreviewController::help
    methods: GET

modern_bookings:
    path: /web/buchungen
    controller: App\Controller\ModernPreviewController::bookings
    methods: GET

modern_overview:
    path: /web/auslastung
    controller: App\Controller\ModernPreviewController::overview
    methods: GET

modern_day:
    path: /web/tag
    controller: App\Controller\ModernPreviewController::day
    methods: GET

modern_booking:
    path: /web/buchung/{id}
    controller: App\Controller\ModernPreviewController::booking
    methods: GET
    requirements:
        id: '\d+'

modern_reserve:
    path: /web/reservieren
    controller: App\Controller\ModernPreviewController::reserve
    methods: GET

modern_booking_edit:
    path: /web/buchung/{id}/bearbeiten
    controller: App\Controller\ModernPreviewController::reserve
    methods: GET
    requirements:
        id: '\d+'

modern_licences:
    path: /web/lizenzen
    controller: App\Controller\ModernPreviewController::licences
    methods: GET

modern_licence_new:
    path: /web/lizenz/neu
    controller: App\Controller\ModernPreviewController::licenceNew
    methods: GET

modern_licence_save:
    path: /web/lizenz/speichern
    controller: App\Controller\ModernPreviewController::licenceSave
    methods: POST

modern_licence_edit:
    path: /web/lizenz/{id}
    controller: App\Controller\ModernPreviewController::licenceEdit
    methods: GET
    requirements:
        id: '\d+'

modern_notes:
    path: /web/pinnwand
    controller: App\Controller\ModernPreviewController::notes
    methods: GET

modern_note_new:
    path: /web/pinnwand/neu
    controller: App\Controller\ModernPreviewController::noteNew
    methods: GET

modern_note_save:
    path: /web/pinnwand/speichern
    controller: App\Controller\ModernPreviewController::noteSave
    methods: POST

modern_note_delete:
    path: /web/pinnwand/loeschen
    controller: App\Controller\ModernPreviewController::noteDelete
    methods: POST

modern_note_edit:
    path: /web/pinnwand/{id}
    controller: App\Controller\ModernPreviewController::noteEdit
    methods: GET
    requirements:
        id: '\d+'

