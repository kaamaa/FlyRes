# --- /mobile -> /mobile/ (PWA wird statisch aus public/mobile/ ausgeliefert) ---
mobile_slash_redirect:
    path: /mobile
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
    defaults:
        path: /mobile/
        permanent: true
    methods: GET
