    methods: GET

modern_licence_save:
    path: /modern/lizenz/speichern
    controller: App\Controller\ModernPreviewController::licenceSave
    methods: POST

modern_licence_edit:
    path: /modern/lizenz/{id}
    controller: App\Controller\ModernPreviewController::licenceEdit
    methods: GET
    requirements:
        id: '\d+'

modern_notes:
    path: /modern/pinnwand
    controller: App\Controller\ModernPreviewController::notes
    methods: GET

modern_note_new:
    path: /modern/pinnwand/neu
    controller: App\Controller\ModernPreviewController::noteNew
    methods: GET

modern_note_save:
