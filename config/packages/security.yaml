security:
      
    providers:
      app_user_provider:
          entity:
              class: App\Entity\FresAccounts
              # KEIN 'property' -> der Provider nutzt UserRepository::loadUserByIdentifier
              # (mandantenfaehig, "clientid:username"). Mit 'property: username' wuerde
              # er per findOneBy(username) laden und bei gleichem Namen den falschen
              # Mandanten treffen (Remember-Me-"Sprung").
       
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 
            id: 'App\Security\Hasher\CustomPasswordHasher'    
   
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false 
              
        main:
            custom_authenticators:
              - App\Security\BearerTokenAuthenticator
              - App\Security\LoginFormAuthenticator
      
            entry_point: App\Security\LoginFormAuthenticator   # <- WICHTIG
            lazy: true
            stateless: false
            provider: app_user_provider

            # Brute-Force-Bremse fuers Login. Benoetigt symfony/rate-limiter (jetzt
            # EXPLIZIT in composer.json verankert, v6.4.42).
            # DEPLOY-SICHERHEIT: vendor/symfony/rate-limiter/ MUSS auf dem Server liegen,
            # sonst Container-Compile-Fehler = 500 auf allen Seiten. Vor dem Hochladen
            # dieser Datei per /ratelimit-check.php pruefen (muss "OK" sagen).
            login_throttling:
                max_attempts: 5              # pro Benutzer+IP
                interval: '15 minutes'

            remember_me:
                secret:   '%kernel.secret%'
                lifetime: 2592000
                # 30 days in seconds
                path: /
                # Cross-Site-iframe (Joomla): RememberMe-Cookie nur mit SameSite=None
                # (auf HTTPS automatisch Secure) wird im iframe mitgesendet.
                samesite: none
                # always_remember_me: true
                user_provider: app_user_provider
                #signature_properties: ['username', 'clientid']

            logout:
                path: app_logout          # Route-Name ODER Pfadname, s. Punkt 2
                target: app_login         # Route-Name oder URL
                invalidate_session: true
                delete_cookies:
                    REMEMBERME: ~
                clear_site_data: ['cookies', 'storage', 'executionContexts'] # optional (>=6.3)

            #json_login:
                # api_login is a route we will create below
                #check_path: app_json
                #remember_me: true
                #username_path: username
                #password_path: password
                

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/mobile, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/logout, roles: PUBLIC_ACCESS }
        - { path: ^/api/verify, roles: PUBLIC_ACCESS }
        - { path: ^/api/tokens$, methods: [POST], roles: PUBLIC_ACCESS }
        # iPhone-PWA JSON-API (M1): PUBLIC_ACCESS, damit die Controller bei fehlendem
        # Login sauberes JSON (401) statt eines HTML-Login-Redirects liefern koennen.
        # Die Zugriffspruefung (angemeldet + ROLE_PILOT) erfolgt in App\Controller\Api.
        - { path: ^/api/(clients|me|aircraft|instructors|pilots|flightpurposes|airfields|bookings|availability|comparematrix|nextslots|fleet|tokens)(/|$), roles: PUBLIC_ACCESS }
        # Oeffentliche Flugvorbereitungs-Werkzeuge (ohne Login, z.B. Einbindung auf
        # der Homepage). Rechnung/Aufloesung laeuft server-seitig -> keine Rohdaten
        # werden ausgeliefert. CSRF-Origin-Schutz (CsrfOriginSubscriber) greift weiter.
        - { path: ^/web/weight-balance, roles: PUBLIC_ACCESS }
        - { path: ^/web/flight-planning, roles: PUBLIC_ACCESS }
        - { path: ^/web/sunrise-sunset, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_GUEST }
        # Hinweis: weitere Pfad-Rollen werden in den Controllern via denyAccessUnlessGranted()
        # geprueft (z.B. ROLE_ADMIN fuer Flugzeug-/Nutzer-/Typ-Verwaltung, ROLE_SYSTEM_ADMIN
        # fuer /getusermail). Frueher standen hier ^/admin, ^/editaircraft, ^/getusermail –
        # die waren nach der Catch-all-Regel ^/ aber wirkungslos (first match wins) und sind
        # deshalb entfernt, um keinen falschen Schutz vorzutaeuschen.

    role_hierarchy:
        ROLE_GUEST:
        ROLE_PILOT:        [ROLE_GUEST]
        ROLE_FI:           [ROLE_PILOT, ROLE_GUEST]
        ROLE_ADMIN:        [ROLE_FI, ROLE_PILOT, ROLE_GUEST]
        ROLE_SYSTEM_ADMIN: [ROLE_ADMIN, ROLE_FI, ROLE_PILOT, ROLE_GUEST]
        ROLE_GLOBAL_ADMIN: [ROLE_SYSTEM_ADMIN, ROLE_ADMIN, ROLE_FI, ROLE_PILOT, ROLE_GUEST, ROLE_ALLOWED_TO_SWITCH]
       
       
