doctrine:
  orm:
    # true, weil dieser Server per FTP (ohne Konsole/cache:warmup) deployt wird:
    # so erzeugt Doctrine fehlende Proxy-Klassen zur Laufzeit selbst, statt mit
    # "Failed opening required ...Proxies/__CG__...php" abzustürzen, wenn var/cache
    # geleert wurde. Minimaler Performance-Aufwand, fuer diese App vernachlaessigbar.
    auto_generate_proxy_classes: true
    # Second-Level-Cache: ohne region_cache_driver faellt Doctrine auf einen
    # In-Memory ArrayAdapter zurueck (nur pro Request) -> die setCacheable(true)-
    # Abfragen brachten ueber Requests hinweg NICHTS. Hier auf einen persistenten
    # Pool legen, damit der SLC tatsaechlich greift. Doctrine invalidiert die
    # Regionen automatisch bei persist/flush (NONSTRICT_READ_WRITE auf den Entities).
    second_level_cache:
      enabled: true
      region_cache_driver:
        type: pool
        pool: doctrine.second_level_cache_pool
    metadata_cache_driver:
      type: pool
      pool: doctrine.system_cache_pool
    query_cache_driver:
      type: pool
      pool: doctrine.system_cache_pool
    result_cache_driver:
      type: pool
      pool: doctrine.result_cache_pool  

framework:
    cache:
        pools:
            doctrine.result_cache_pool:
                adapter: cache.app
            doctrine.system_cache_pool:
                adapter: cache.system
            doctrine.second_level_cache_pool:
                adapter: cache.app
