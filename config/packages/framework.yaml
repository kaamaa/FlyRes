framework:
  
    secret: '%env(APP_SECRET)%'
    handle_all_throwables: true
    #csrf_protection: true
    #http_method_override: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.

    #session:
    #    enabled: true
    #    use_cookies: true
    #    cookie_secure: auto
    #    cookie_samesite: lax
    #    handler_id: 'session.handler.native_file'
    #    save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'

    
    session:
      name: PHPSESSID
      cookie_samesite: lax
      cookie_path: '/'
      cookie_secure: auto
      handler_id: null

    php_errors:
        log: true
        
    router:
        strict_requirements: true
        
    form:
      csrf_protection: ~
      #  enabled: false
      
    validation:
      enable_attributes: true
      email_validation_mode: html5

    default_locale:  "%locale%"
    # trusted_hosts:   ~

    # Apache-Reverse-Proxy laeuft auf demselben Host: nur localhost als Proxy
    # vertrauen, damit X-Forwarded-For (die echte Client-IP) ausgewertet wird
    # -- Grundlage fuers IP-basierte Rate-Limit von POST /api/tokens. Von aussen
    # gesetzte X-Forwarded-*-Header werden NICHT vertraut (kein IP-Spoofing).
    # Bei Wechsel auf einen vorgelagerten LB dessen IP/Range hier ergaenzen.
    trusted_proxies: '127.0.0.1,::1'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    fragments:       ~
    http_method_override: true    
